<div class="w-full">
    <label *ngIf="label" [for]="id" class="mb-1.5 block text-xs sm:text-sm font-medium text-slate-900 dark:text-white">
        {{ label }}
    </label>
    <div class="relative">
        <span *ngIf="icon" class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 text-[20px]">
            {{ icon }}
        </span>
        <input [id]="id" [type]="type" [value]="value" [placeholder]="placeholder" [disabled]="disabled"
            (input)="onInput($event)" (blur)="onTouch()"
            class="w-full rounded-xl border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-800 text-slate-900 dark:text-white py-2 sm:py-2.5 text-xs sm:text-sm focus:border-primary focus:ring-2 focus:ring-primary/20 disabled:bg-slate-100 dark:disabled:bg-slate-900 disabled:text-slate-500 transition-all"
            [ngClass]="{
        'pl-10': icon,
        'px-3.5': !icon,
        'border-red-500 focus:border-red-500 focus:ring-red-500': error
      }" />
    </div>
    <p *ngIf="error" class="mt-1 text-xs text-red-500">{{ error }}</p>
</div>
