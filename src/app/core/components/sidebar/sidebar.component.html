<aside class="flex h-screen w-64 flex-col border-r border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900 transition-colors duration-200">
    <div class="flex h-16 items-center border-b border-slate-200 dark:border-slate-800 px-6">
        <div class="flex items-center gap-2 text-primary">
            <span class="material-symbols-outlined text-3xl">receipt_long</span>
            <span class="text-xl font-black tracking-tight text-slate-900 dark:text-white">Fatura<span class="text-primary">Pro</span></span>
        </div>
    </div>

    <nav class="flex-1 overflow-y-auto p-4">
        <ul class="space-y-1">
            <li *ngFor="let item of menuItems">
                <a [routerLink]="item.route" routerLinkActive="bg-primary/10 text-primary dark:bg-primary/20 dark:text-blue-400 font-bold"
                    class="flex items-center gap-3 rounded-lg px-3 py-2.5 text-sm font-medium text-slate-600 dark:text-slate-300 transition-colors hover:bg-slate-100 dark:hover:bg-slate-800 hover:text-slate-900 dark:hover:text-white">
                    <span class="material-symbols-outlined text-[20px]">{{ item.icon }}</span>
                    {{ lang.t(item.labelKey) }}
                </a>
            </li>
        </ul>
    </nav>

    <div class="border-t border-slate-200 dark:border-slate-800 p-3 space-y-3">
        <!-- Theme Switcher -->
        <button (click)="themeService.toggleTheme()"
            class="flex items-center justify-between w-full px-3 py-2 rounded-lg bg-slate-100 dark:bg-slate-800 text-slate-700 dark:text-slate-200 text-xs font-semibold hover:bg-slate-200 dark:hover:bg-slate-700 transition-colors">
            <span class="flex items-center gap-2">
                <span class="material-symbols-outlined text-[18px] text-amber-500" *ngIf="!themeService.isDark">light_mode</span>
                <span class="material-symbols-outlined text-[18px] text-indigo-400" *ngIf="themeService.isDark">dark_mode</span>
                <span>{{ themeService.isDark ? 'Koyu Tema (Dark)' : 'Açık Tema (Light)' }}</span>
            </span>
            <span class="text-[10px] uppercase tracking-wider px-2 py-0.5 rounded bg-white dark:bg-slate-900 text-slate-500 dark:text-slate-400 shadow-sm">
                {{ themeService.isDark ? 'DARK' : 'LIGHT' }}
            </span>
        </button>

        <!-- Language Selector -->
        <div class="flex items-center gap-1 bg-slate-100 dark:bg-slate-800 rounded-lg p-1">
            <button (click)="lang.setLanguage('tr')" 
                [class]="'flex-1 px-3 py-1.5 rounded-md text-xs font-medium transition-all ' + (lang.lang === 'tr' ? 'bg-white dark:bg-slate-700 text-primary dark:text-blue-400 shadow-sm' : 'text-slate-600 dark:text-slate-400')">
                🇹🇷 Türkçe
            </button>
            <button (click)="lang.setLanguage('en')" 
                [class]="'flex-1 px-3 py-1.5 rounded-md text-xs font-medium transition-all ' + (lang.lang === 'en' ? 'bg-white dark:bg-slate-700 text-primary dark:text-blue-400 shadow-sm' : 'text-slate-600 dark:text-slate-400')">
                🇬🇧 English
            </button>
        </div>
        
        <!-- Logout -->
        <button (click)="logout()"
            class="flex w-full items-center gap-3 rounded-lg px-3 py-2.5 text-sm font-medium text-red-600 dark:text-red-400 transition-colors hover:bg-red-50 dark:hover:bg-red-950/40">
            <span class="material-symbols-outlined text-[20px]">logout</span>
            {{ lang.t('auth.logout') }}
        </button>
    </div>
</aside>
