<div class="min-h-screen min-h-[100dvh] flex flex-col items-center justify-center bg-slate-50 dark:bg-slate-950 p-4 relative transition-colors duration-200">
    <!-- Dil Seçici -->
    <div class="absolute top-4 right-4 flex items-center gap-1 bg-white dark:bg-slate-900 rounded-lg p-1 shadow-md border border-slate-200 dark:border-slate-800 z-10">
        <button (click)="lang.setLanguage('tr')" 
            [class]="'px-3 py-1.5 rounded-md text-xs sm:text-sm font-medium transition-all ' + (lang.lang === 'tr' ? 'bg-primary text-white' : 'text-slate-600 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-800')">
            🇹🇷 TR
        </button>
        <button (click)="lang.setLanguage('en')" 
            [class]="'px-3 py-1.5 rounded-md text-xs sm:text-sm font-medium transition-all ' + (lang.lang === 'en' ? 'bg-primary text-white' : 'text-slate-600 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-800')">
            🇬🇧 EN
        </button>
    </div>

    <div class="w-full max-w-md bg-white dark:bg-slate-900 p-6 sm:p-8 rounded-2xl shadow-xl border border-slate-200 dark:border-slate-800 my-auto">
        <!-- Logo -->
        <div class="text-center mb-6 sm:mb-8">
            <div class="flex items-center justify-center gap-2 text-primary mb-3 sm:mb-4">
                <span class="material-symbols-outlined text-3xl sm:text-4xl">receipt_long</span>
                <span class="text-xl sm:text-2xl font-black tracking-tight text-slate-900 dark:text-white">Fatura<span class="text-primary">Pro</span></span>
            </div>
            <h1 class="text-xl sm:text-2xl font-bold text-slate-900 dark:text-white">{{ lang.t('auth.welcome') }}</h1>
            <p class="text-slate-500 dark:text-slate-400 text-xs sm:text-sm mt-1 sm:mt-2">{{ lang.t('auth.enterCredentials') }}</p>
        </div>

        <!-- Google Login -->
        <button (click)="loginWithGoogle()" [disabled]="isLoading"
            class="w-full flex items-center justify-center gap-3 bg-white dark:bg-slate-800 border-2 border-slate-200 dark:border-slate-700 text-slate-700 dark:text-slate-200 font-semibold py-2.5 sm:py-3 rounded-xl hover:bg-slate-50 dark:hover:bg-slate-700/80 transition-all mb-5 sm:mb-6 text-xs sm:text-sm disabled:opacity-50 disabled:cursor-not-allowed">
            <img *ngIf="!isLoading" src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt="Google" class="w-5 h-5">
            <span *ngIf="isLoading" class="material-symbols-outlined animate-spin text-xl">progress_activity</span>
            {{ isLoading ? lang.t('auth.loggingIn') : lang.t('auth.loginWithGoogle') }}
        </button>

        <!-- Messages -->
        <div *ngIf="errorMessage" class="mb-4 p-3 bg-red-50 dark:bg-red-950/40 border border-red-200 dark:border-red-800 rounded-xl text-red-600 dark:text-red-400 text-xs sm:text-sm">
            {{ errorMessage }}
        </div>
        <div *ngIf="successMessage" class="mb-4 p-3 bg-emerald-50 dark:bg-emerald-950/40 border border-emerald-200 dark:border-emerald-800 rounded-xl text-emerald-700 dark:text-emerald-300 text-xs sm:text-sm flex items-center gap-2">
            <span class="material-symbols-outlined text-lg">check_circle</span>
            {{ successMessage }}
        </div>

        <!-- Divider -->
        <div class="relative mb-5 sm:mb-6">
            <div class="absolute inset-0 flex items-center">
                <div class="w-full border-t border-slate-200 dark:border-slate-800"></div>
            </div>
            <div class="relative flex justify-center text-xs sm:text-sm">
                <span class="px-3 bg-white dark:bg-slate-900 text-slate-400 dark:text-slate-500">{{ lang.t('auth.orWithEmail') }}</span>
            </div>
        </div>

        <!-- Form -->
        <form (ngSubmit)="login()" class="space-y-4">
            <div>
                <label class="block text-xs sm:text-sm font-medium text-slate-700 dark:text-slate-300 mb-1.5">{{ lang.t('common.email') }}</label>
                <div class="relative">
                    <span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 text-xl">mail</span>
                    <input type="email" [(ngModel)]="email" name="email" placeholder="ornek@sirket.com"
                        class="w-full h-11 sm:h-12 pl-11 pr-4 rounded-xl border-2 border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 text-slate-900 dark:text-white text-xs sm:text-sm focus:border-primary focus:ring-0 transition-colors">
                </div>
            </div>

            <div>
                <label class="block text-xs sm:text-sm font-medium text-slate-700 dark:text-slate-300 mb-1.5">{{ lang.t('auth.password') }}</label>
                <div class="relative">
                    <span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 text-xl">lock</span>
                    <input type="password" [(ngModel)]="password" name="password" placeholder="••••••••"
                        class="w-full h-11 sm:h-12 pl-11 pr-4 rounded-xl border-2 border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 text-slate-900 dark:text-white text-xs sm:text-sm focus:border-primary focus:ring-0 transition-colors">
                </div>
            </div>

            <div class="flex items-center justify-between text-xs sm:text-sm">
                <label class="flex items-center gap-2 cursor-pointer">
                    <input type="checkbox" class="w-4 h-4 rounded border-slate-300 dark:border-slate-700 text-primary focus:ring-primary">
                    <span class="text-slate-600 dark:text-slate-400">{{ lang.t('auth.rememberMe') }}</span>
                </label>
                <button type="button" (click)="forgotPassword()" class="text-primary dark:text-blue-400 font-medium hover:underline text-xs bg-transparent border-0 cursor-pointer">
                    {{ lang.t('auth.forgotPassword') }}
                </button>
            </div>

            <button type="submit" [disabled]="isLoading"
                class="w-full h-11 sm:h-12 bg-primary text-white font-semibold rounded-xl hover:bg-blue-700 transition-colors text-xs sm:text-sm disabled:opacity-50 disabled:cursor-not-allowed">
                {{ lang.t('auth.login') }}
            </button>
        </form>
    </div>
</div>
